<!DOCTYPE html>
<html>

<head>

<title>Interview Report</title>

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Report</title>


<link rel="stylesheet" href="css/style.css">

<style>

    .result-container{
        flex:1;
        padding:30px;
    }

    .score-card{
        background:#1f2937;
        padding:30px;
        border-radius:20px;
        text-align:center;
        margin-bottom:20px;
    }

    .score{
        font-size:70px;
        font-weight:bold;
        color:#3b82f6;
    }

    .stats{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:20px;
        margin-top:20px;
    }

    .stat-card{
        background:#1f2937;
        padding:20px;
        border-radius:15px;
        text-align:center;
    }

    .section{
        background:#1f2937;
        padding:20px;
        border-radius:15px;
        margin-top:20px;
    }

    .good{
        color:#22c55e;
    }

    .warning{
        color:#f59e0b;
    }

    .restart-btn{
        margin-top:20px;
    }

</style>
</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <h2>🤖 AI Interview Coach</h2>

   

    <ul>

        <li>
            <a href="index.html">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="select.html">
                🎤 Start Interview
            </a>
        </li>

        <li>
            <a href="result.html">
                📊 Results
            </a>
        </li>

        <li>
            <a href="tips.html">
                💡 Tips
            </a>
        </li>

    </ul>
     

</div>

<!-- Main Result Area -->

<div class="result-container">

    


    <div class="score-card">

        <h1>Interview Completed 🎉</h1>

        <div class="score" id="score">
            0
        </div>

        <p>Overall Performance Score</p>

    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>Technical</h3>
            <h2 id="technical">0</h2>
        </div>

        <div class="stat-card">
            <h3>Communication</h3>
            <h2 id="communication">0</h2>
        </div>

        <div class="stat-card">
            <h3>Confidence</h3>
            <h2 id="confidence">0</h2>
        </div>

        <div class="stat-card">
            <h3>Structure</h3>
            <h2 id="structure">0</h2>
        </div>

    </div>

<div class="section">

    <h2>✅ Strengths</h2>

    <ul class="strengths-list">
    </ul>

</div>

<div class="section">

    <h2>⚠ Areas to Improve</h2>

    <ul class="improve-list">
    </ul>

</div>

    <button class="restart-btn" onclick="restart()">
        Take Interview Again
    </button>

</div>

<script src="js/theme.js"></script>

<script>

    let score =
    parseInt(localStorage.getItem("finalScore")) || 0;

    document.getElementById("score")
    .innerText = score + "/100";

    document.getElementById("technical")
    .innerText = Math.max(score - 5, 0);

    document.getElementById("communication")
    .innerText = Math.max(score - 10, 0);

    document.getElementById("confidence")
    .innerText = Math.max(score - 3, 0);

    document.getElementById("structure")
    .innerText = Math.max(score - 8, 0);
    const strengthsList =
document.querySelector(".strengths-list");

const improveList =
document.querySelector(".improve-list");

if(score >= 90){

    strengthsList.innerHTML = `
        <li class="good">Outstanding technical knowledge</li>
        <li class="good">Excellent communication skills</li>
        <li class="good">Professional answer structure</li>
        <li class="good">Strong confidence level</li>
        <li class="good">Used all important keywords</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Practice advanced interview scenarios</li>
    `;

}
else if(score >= 80){

    strengthsList.innerHTML = `
        <li class="good">Very good technical understanding</li>
        <li class="good">Clear communication</li>
        <li class="good">Good answer structure</li>
        <li class="good">Relevant keywords used</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Add more real-world examples</li>
        <li class="warning">Improve leadership-based answers</li>
    `;

}
else if(score >= 70){

    strengthsList.innerHTML = `
        <li class="good">Good understanding of concepts</li>
        <li class="good">Answered most questions correctly</li>
        <li class="good">Good communication skills</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Provide more detailed explanations</li>
        <li class="warning">Improve answer structure</li>
        <li class="warning">Use more practical examples</li>
    `;

}
else if(score >= 60){

    strengthsList.innerHTML = `
        <li class="good">Basic technical knowledge shown</li>
        <li class="good">Attempted all questions</li>
        <li class="good">Some relevant keywords used</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Improve communication skills</li>
        <li class="warning">Increase answer length</li>
        <li class="warning">Explain concepts more clearly</li>
        <li class="warning">Practice mock interviews</li>
    `;

}
else if(score >= 40){

    strengthsList.innerHTML = `
        <li class="good">Showed willingness to answer</li>
        <li class="good">Basic understanding demonstrated</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Revise core concepts</li>
        <li class="warning">Use more technical keywords</li>
        <li class="warning">Practice answering confidently</li>
        <li class="warning">Improve communication skills</li>
        <li class="warning">Provide complete answers</li>
    `;

}
else{

    strengthsList.innerHTML = `
        <li class="good">Completed the interview session</li>
        <li class="good">Made an effort to answer questions</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Review interview fundamentals</li>
        <li class="warning">Practice basic technical concepts</li>
        <li class="warning">Increase answer length</li>
        <li class="warning">Use relevant keywords</li>
        <li class="warning">Improve confidence while speaking</li>
        <li class="warning">Practice daily mock interviews</li>
    `;

}

    function restart(){

        localStorage.removeItem("finalScore");

        window.location.href =
        "index.html";

    }

</script>
```

</body>

</html>
