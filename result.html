<!DOCTYPE html>
<html>

<head>

<title>Interview Report</title>

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Report</title>


<link rel="stylesheet" href="css/style.css">

<style>

    .result-container{
        flex:1;
        padding:30px;
    }

    .score-card{
        background:#1f2937;
        padding:30px;
        border-radius:20px;
        text-align:center;
        margin-bottom:20px;
    }

    .score{
        font-size:70px;
        font-weight:bold;
        color:#3b82f6;
    }

    .stats{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:20px;
        margin-top:20px;
    }

    .stat-card{
        background:#1f2937;
        padding:20px;
        border-radius:15px;
        text-align:center;
    }

    .section{
        background:#1f2937;
        padding:20px;
        border-radius:15px;
        margin-top:20px;
    }

    .good{
        color:#22c55e;
    }

    .warning{
        color:#f59e0b;
    }

    .restart-btn{
        margin-top:20px;
    }

</style>
</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <h2>🤖 AI Interview Coach</h2>

   

    <ul>

        <li>
            <a href="index.html">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="select.html">
                🎤 Start Interview
            </a>
        </li>

        <li>
            <a href="result.html">
                📊 Results
            </a>
        </li>

        <li>
            <a href="tips.html">
                💡 Tips
            </a>
        </li>

    </ul>
     

</div>

<!-- Main Result Area -->

<div class="result-container">

    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>

    <div class="score-card">

        <h1>Interview Completed 🎉</h1>

        <div class="score" id="score">
            0
        </div>

        <p>Overall Performance Score</p>

    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>Technical</h3>
            <h2 id="technical">0</h2>
        </div>

        <div class="stat-card">
            <h3>Communication</h3>
            <h2 id="communication">0</h2>
        </div>

        <div class="stat-card">
            <h3>Confidence</h3>
            <h2 id="confidence">0</h2>
        </div>

        <div class="stat-card">
            <h3>Structure</h3>
            <h2 id="structure">0</h2>
        </div>

    </div>

<div class="section">

    <h2>✅ Strengths</h2>

    <ul class="strengths-list">
    </ul>

</div>

<div class="section">

    <h2>⚠ Areas to Improve</h2>

    <ul class="improve-list">
    </ul>

</div>

    <button class="restart-btn" onclick="restart()">
        Take Interview Again
    </button>

</div>

<script src="js/theme.js"></script>

<script>

    let score =
    parseInt(localStorage.getItem("finalScore")) || 0;

    document.getElementById("score")
    .innerText = score + "/100";

    document.getElementById("technical")
    .innerText = Math.max(score - 5, 0);

    document.getElementById("communication")
    .innerText = Math.max(score - 10, 0);

    document.getElementById("confidence")
    .innerText = Math.max(score - 3, 0);

    document.getElementById("structure")
    .innerText = Math.max(score - 8, 0);
    const strengthsList =
document.querySelector(".strengths-list");

const improveList =
document.querySelector(".improve-list");

if(score >= 80){

    strengthsList.innerHTML = `
        <li class="good">Excellent technical knowledge</li>
        <li class="good">Strong communication skills</li>
        <li class="good">Well-structured answers</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Add more real-world examples</li>
        <li class="warning">Practice advanced questions</li>
    `;

}
else if(score >= 60){

    strengthsList.innerHTML = `
        <li class="good">Good understanding of concepts</li>
        <li class="good">Used relevant keywords</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Improve answer structure</li>
        <li class="warning">Provide more detailed answers</li>
        <li class="warning">Improve confidence</li>
    `;

}
else{

    strengthsList.innerHTML = `
        <li class="good">Attempted all questions</li>
        <li class="good">Basic understanding shown</li>
    `;

    improveList.innerHTML = `
        <li class="warning">Practice technical concepts</li>
        <li class="warning">Increase answer length</li>
        <li class="warning">Improve communication skills</li>
        <li class="warning">Use more keywords</li>
    `;

}

    function restart(){

        localStorage.removeItem("finalScore");

        window.location.href =
        "index.html";

    }

</script>
```

</body>

</html>
