<!DOCTYPE html>
<html>

<head>
    <title>Interview Session</title>

    <link rel="stylesheet" href="css/style.css">

    

    <style>

        .container{
            width:90%;
            margin:auto;
            margin-top:40px;
        }

        .question-card{
            background:#1f2937;
            padding:30px;
            border-radius:20px;
        }

        .question{
            font-size:24px;
            margin-top:15px;
        }

        textarea{
            width:100%;
            height:180px;
            margin-top:20px;
            padding:15px;
            border:none;
            border-radius:15px;
            font-size:16px;
        }

        .buttons{
            margin-top:20px;
            display:flex;
            gap:15px;
        }

        .progress{
            width:100%;
            background:#374151;
            height:15px;
            border-radius:20px;
            margin-top:20px;
        }

        .progress-bar{
            width:0%;
            height:100%;
            background:#3b82f6;
            border-radius:20px;
        }

        .timer{
            font-size:20px;
            margin-top:15px;
        }

        .feedback{
            background:#1f2937;
            padding:20px;
            border-radius:15px;
            margin-top:20px;
        }
        .main{

    margin-left:340px;

}

    </style>

</head>

<body>
    
<div class="sidebar">

    <h2>🤖 AI Interview Coach</h2>
    

    <ul>

        <li>
            <a href="index.html">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="select.html">
                🎤 Start Interview
            </a>
        </li>

        <li>
            <a href="result.html">
                📊 Results
            </a>
        </li>

       <li>
             <a href="tips.html">
                💡 Tips
            </a>
        </li>
    

    </ul>
    
    

</div>

<div class="back-container">
    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>
</div>

<div class="container">

    <h1>AI Interview Coach</h1>

    <div class="progress">

        <div class="progress-bar" id="progressBar"></div>

    </div>

    <div class="timer">

        Time Left:
        <span id="timer">60</span>s

    </div>

    <div class="question-card">

        <h3 id="counter">
            Question 1 / 5
        </h3>

        <p class="question" id="questionText">
            Loading...
        </p>

        <textarea
        id="answer"
        placeholder="Type your answer or use voice..."></textarea>

        <div class="buttons">

            <button onclick="startVoice()">
                🎤 Speak
            </button>

            <button id="submitBtn">
            Submit
            </button>

        </div>

    </div>

    <div class="feedback" id="feedback">

        Feedback will appear here...

    </div>

</div>

</div>


<script src="js/questions.js"></script>
<script src="js/scoring.js"></script>
<script src="js/voice.js"></script>
<script src="js/theme.js"></script>

<script>

let category =
localStorage.getItem("category") || "hr";

let questions =
interviewQuestions[category];
console.log("Category:", category);
console.log("Questions:", questions);

let current = 0;

let scores = [];

let timeLeft = 60;

const questionText =
document.getElementById("questionText");

const counter =
document.getElementById("counter");

const progressBar =
document.getElementById("progressBar");

const feedback =
document.getElementById("feedback");

loadQuestion();

function loadQuestion(){

    questionText.innerText =
    questions[current].question;

    counter.innerText =
    `Question ${current+1} / ${questions.length}`;

    progressBar.style.width =
    ((current)/questions.length)*100 + "%";

}

function submitAnswer(){

    let answer =
    document.getElementById("answer").value;

    let score =
    calculateScore(
        answer,
        questions[current].keywords
    );

    scores.push(score);

    if(score >= 80){

        feedback.innerHTML =
        "✅ Excellent Answer";

    }
    else if(score >= 50){

        feedback.innerHTML =
        "👍 Good Answer. Add more details.";

    }
    else{

        feedback.innerHTML =
        "⚠ Improve your answer with examples.";

    }

    document.getElementById("answer").value="";

    current++;

    setTimeout(()=>{

        if(current < questions.length){

            loadQuestion();

        }
        else{

            showResult();

        }

    },1500);

}

function showResult(){

    let total = 0;

    scores.forEach(score=>{

        total += score;

    });

    let average =
    Math.round(total/scores.length);

    localStorage.setItem(
        "finalScore",
        average
    );

    window.location.href =
    "result.html";

}

setInterval(() => {

    if(timeLeft > 0){

        timeLeft--;

        document.getElementById("timer")
        .innerText = timeLeft;

        let percentage =
        (timeLeft / 60) * 100;

        progressBar.style.width =
        percentage + "%";

        if(timeLeft <= 15){

            progressBar.style.background =
            "#ef4444";

        }
        else if(timeLeft <= 30){

            progressBar.style.background =
            "#f59e0b";

        }
        else{

            progressBar.style.background =
            "linear-gradient(90deg,#8b5cf6,#3b82f6)";

        }

    }

},1000);

document.getElementById("submitBtn")
.addEventListener("click", submitAnswer);

</script>

</body>

</html>
