<!DOCTYPE html>
<html>
<head>
    <title>Select Interview</title>
    <link rel="stylesheet" href="css/style.css">

    <div class="sidebar">

    <h2>🤖 AI Interview Coach</h2>
    

    <ul>

        <li>
            <a href="index.html">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="select.html">
                🎤 Start Interview
            </a>
        </li>

        <li>
            <a href="result.html">
                📊 Results
            </a>
        </li>

       <li>
            <a href="tips.html">
                💡 Tips
            </a>
        </li>
    </ul>
    

</div>


    <style>

    .category-container{
        width:90%;
        margin:auto;
        margin-top:50px;
    }

    .category-grid{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:20px;
        margin-top:30px;
    }

    .category-card{
        background:#1f2937;
        padding:30px;
        border-radius:20px;
        text-align:center;
        cursor:pointer;
        transition:0.3s;
    }

    .category-card:hover{
        transform:translateY(-5px);
    }

    </style>

</head>
<script src="js/theme.js"></script>

<body>

<div class="back-container">
    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>
</div>

<div class="category-container">

<h1>Select Interview Type</h1>

<div class="category-grid">

<div class="category-card"
onclick="selectCategory('hr')">
<h2>👨‍💼 HR Interview</h2>
</div>

<div class="category-card"
onclick="selectCategory('python')">
<h2>🐍 Python Interview</h2>
</div>

<div class="category-card"
onclick="selectCategory('java')">
<h2>☕ Java Interview</h2>
</div>

<div class="category-card"
onclick="selectCategory('web')">
<h2>🌐 Web Development</h2>
</div>

</div>

</div>

<script>

function selectCategory(type){

localStorage.setItem(
"category",
type
);

window.location.href =
"interview.html";

}

</script>

</body>
</html>
